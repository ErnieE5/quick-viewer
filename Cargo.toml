[package]
name = "qv"
version = "0.1.0"
edition = "2024"

[profile.dev]
opt-level = 0

[profile.dev.package."*"]
opt-level = 3

[dependencies]
clap = { version="4.6.1", features=["derive"] }
dyn-clone = "1.0.20"
ee-conio = "0.1.0-alpha.2"
fastrand = "2.4.1"
heic = { version="0.1.4", features=["parallel"] }
#iced = { path = "../iced", version = "0.15.0-dev", features = ["image", "canvas", "advanced", "tokio" ,  "sipper"] }
#iced_core = { path="../iced/core", version="0.15.0-dev" }

iced = { version = "0.14.0", features = ["image", "canvas", "advanced", "tokio",  "sipper", "wgpu"  ] }
iced_core = {  version="0.14.0" }


image = "0.25.10"
lru = "0.17.0"
num-format = "0.4.4"
serde = "1.0.228"
tokio = { version = "1.52.1", features = ["full"] }
walkdir = "2.5.0"

