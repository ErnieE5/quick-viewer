[package]
name = "qv"
version = "0.1.0"
edition = "2024"


[features]
default=["heif"]
heif=["libheif-rs"]    # needs native libheif — see HEIF-BUILD.md; omit with --no-default-features


[dependencies]
ee-conio = "0.1.0-alpha.6"
ee-viewer = { path="../ee-viewer", version="0.1.0" }
clap = { version="4.6.1", features=["derive"] }
image = "0.25.10"
libheif-rs = {version="2.7.0", features=["image"], optional=true }


#iced = { path = "../../iced", version = "0.15.0-dev", features = ["image", "canvas", "advanced", "tokio" ,  "sipper"] }
#iced_core = { path="../../iced/core", version="0.15.0-dev" }
iced = { version = "0.14.0", features = ["image", "canvas", "advanced", "tokio",  "sipper", "wgpu"  ] }
iced_core = {  version="0.14.0" }

#   Monitor geometry for --screen / --span / --w / --h / --x / --y. Windows only, and
#   target-gated so a Linux build never resolves, downloads or compiles it. The
#   non-Windows path in geometry.rs falls back to iced's own defaults.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }
